name: Local-slice verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.6'
          enable-cache: false
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: node --version && node --test tests/ui-races.cjs
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m pytest --cov=workbench --cov-report=term-missing
      - run: uv run --locked python -m scripts.smoke
      - run: uv run --locked python -m pip_audit -r requirements.txt --require-hashes --disable-pip

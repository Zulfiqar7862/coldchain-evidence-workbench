[project]
name = "coldchain-evidence-workbench"
version = "0.1.0"
description = "Synthetic evidence-first temperature review workbench"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "pytest-cov>=6,<8",
    "pip-audit>=2.9,<3",
    "pillow>=13,<14",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
